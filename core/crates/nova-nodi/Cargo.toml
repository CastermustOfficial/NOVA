[package]
name = "nova-nodi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Il nodo della memoria e la sua forma su disco: markdown piu' frontmatter."

[dependencies]
# Il guardiano dei segreti vive li': cosa **e'** un segreto si decide in un
# posto solo, o i due elenchi si disallineano e una chiave AWS finisce in
# chiaro nel giornale mentre il vault la rifiuta (D73). La dipendenza va in
# questa direzione e non nell'altra: `nova-guasti` non deve sapere che esiste
# un vault.
nova-guasti = { path = "../nova-guasti" }
# La potatura dei diari: due megabyte e uno storico. E' la stessa regola per
# il registro del vault e per quello delle azioni, e una regola sola non puo'
# stare dentro uno dei due (D73).
nova-potatura = { path = "../nova-potatura" }
# La semina scrive i byte come li scrive Python (`pesa`), e legge i README
# come li legge Python: le righe, i bianchi, i byte rotti (`nova-pitone`).
nova-dati = { path = "../nova-dati" }
nova-pitone = { path = "../nova-pitone" }
serde = { workspace = true, features = ["derive"], optional = true }
# Le risposte del modulo di memoria arrivano in JSON (`imparare`).
serde_json = { workspace = true }

[features]
banco = ["dep:serde"]

[[bin]]
name = "banco-nodi"
path = "src/banco.rs"
required-features = ["banco"]
