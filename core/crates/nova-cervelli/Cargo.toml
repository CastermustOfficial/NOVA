[package]
name = "nova-cervelli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cosa NOVA dice a un cervello che vive fuori: la riga di comando, il prompt di sistema, il payload."

[dependencies]
# Il payload di una chiamata OpenAI-compatibile e' JSON, e l'ordine delle
# chiavi si conserva: si confronta carattere per carattere col Python.
serde_json = { workspace = true }
# «Un solo messaggio di sistema in testa» e' una regola di finestra, e la
# finestra sta li' (D73).
nova-contesto = { path = "../nova-contesto" }
# Le parole con cui si racconta un guasto stanno li', gia' confrontate
# col Python da un banco (D135).
nova-guasti = { path = "../nova-guasti" }
# `.strip()` di Python non e' `trim()` di Rust: le abitudini di Python
# stanno in un posto solo (D182).
nova-pitone = { path = "../nova-pitone" }
# Gia' in casa: `nova-voce` ci parla con ElevenLabs. Un secondo cliente HTTP
# per la stessa cosa sarebbero due comportamenti da conoscere invece di uno.
ureq = "2"
serde = { workspace = true, features = ["derive"], optional = true }

[features]
banco = ["dep:serde"]

[[bin]]
name = "banco-cervelli"
path = "src/banco.rs"
required-features = ["banco"]
