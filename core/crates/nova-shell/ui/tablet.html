<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NOVA</title>
<link rel="stylesheet" href="tema.css">
<style>
  /* NOVA su un altro dispositivo (D449): un tablet che e' solo NOVA.

     In scena c'e' l'orb, grande, e sotto quello che sta facendo, a parole.
     Il discorso scorre sotto, e in fondo si scrive. Niente menu, niente
     finestre: e' una cosa a cui si parla, non un programma da usare.

     La pagina sta ferma sullo schermo (`position:fixed`): quando si apre la
     tastiera il sistema fa scorrere il documento per mostrare il campo, e
     chiusa la tastiera non lo rimetteva a posto. Il 27 novembre, col tablet
     in orizzontale, l'orb e' rimasto fuori dallo schermo. */
  html{overflow:hidden}
  body{position:fixed;inset:0;height:auto;display:flex;flex-direction:column;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
       -webkit-user-select:none;user-select:none}
  #scena{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:4vh 24px 1vh}
  #lato{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column}
  #orb{width:min(46vw,34vh);height:min(46vw,34vh);display:block}
  #detto{margin-top:1.2vh;font-size:19px;color:var(--inchiostro);min-height:1.4em;text-align:center}
  #linea{margin-top:6px;font-size:13px;color:var(--mezzo);min-height:1.3em;text-align:center}
  #linea.guaio{color:var(--attenzione)}
  .bottone:disabled{opacity:.4}

  #discorso{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px max(20px,6vw);display:flex;flex-direction:column;gap:10px;
            -webkit-user-select:text;user-select:text}
  .battuta{display:flex;max-width:100%}
  .battuta.tua{justify-content:flex-end}
  .bolla{max-width:82%;padding:11px 15px;border-radius:18px;font-size:17px;line-height:1.45;overflow-wrap:anywhere}
  .battuta.sua .bolla{background:var(--vetro-2);border:1px solid var(--linea);border-bottom-left-radius:5px}
  .battuta.tua .bolla{background:var(--brace);color:#1a0b05;border-bottom-right-radius:5px;font-weight:500}
  .battuta.guaio .bolla{background:rgba(232,96,74,.12);border:1px solid rgba(232,96,74,.3);color:#f0a698}
  .bolla p{margin:0 0 .45em}
  .bolla p:last-child{margin:0}
  .bolla code{font-family:var(--mono);font-size:14px;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px}
  .bolla pre{background:rgba(0,0,0,.45);border:1px solid var(--linea);border-radius:8px;padding:10px;overflow-x:auto}
  .bolla pre code{background:none;padding:0}
  .bolla a{color:var(--brace)}

  #scrivi{flex:0 0 auto;display:flex;gap:10px;padding:10px max(20px,6vw) 16px}
  #campo{flex:1;min-width:0;background:var(--vetro-2);border:1px solid var(--linea-2);border-radius:14px;
         padding:13px 16px;font-size:17px;outline:none}
  #campo:focus{border-color:var(--brace)}
  #scrivi .bottone{font-size:16px;padding:12px 22px}

  /* Finche' non e' abbinato si vede solo questo. */
  #abbina{flex:1 1 auto;display:none;flex-direction:column;justify-content:center;gap:14px;padding:0 max(24px,10vw) 6vh}
  #abbina h2{font-size:24px;font-weight:600}
  #abbina p{font-size:16px;line-height:1.5;color:var(--mezzo)}
  #invito{background:var(--vetro-2);border:1px solid var(--linea-2);border-radius:14px;padding:13px 16px;
          font-family:var(--mono);font-size:14px;min-height:110px;resize:none;outline:none;-webkit-user-select:text;user-select:text}
  #abbina .bottone{align-self:flex-start;font-size:17px;padding:13px 28px}
  #abbina #doveInvito{color:var(--inchiostro)}
  #abbina #erroreAbbina{color:#f0a698;min-height:1.5em}
  body.da-abbinare #abbina{display:flex}
  body.da-abbinare #discorso, body.da-abbinare #scrivi{display:none}

  /* Solo l'orb: al centro, grande quasi quanto lo schermo, e nient'altro.
     Le parole, quando ci sono, stanno sopra il fondo del canvas, dov'e'
     gia' buio: cosi' l'orb e' al centro esatto, con o senza parole. */
  body.solo-orb #lato{display:none}
  body.solo-orb #scena{flex:1 1 auto;justify-content:center;padding:0;position:relative}
  body.solo-orb #orb{width:min(90vw,90vh);height:min(90vw,90vh)}
  body.solo-orb #detto{position:absolute;left:0;right:0;bottom:7vh;margin:0}
  body.solo-orb #linea{position:absolute;left:0;right:0;bottom:3.5vh;margin:0}

  /* In orizzontale l'orb sta a sinistra e il discorso a destra: uno sopra
     l'altro, con la tastiera aperta non resterebbe posto per nessuno dei
     due. */
  @media (orientation:landscape){
    body{flex-direction:row}
    #scena{flex:0 0 38vw;justify-content:center;padding:2vh 16px}
    #orb{width:min(30vw,58vh);height:min(30vw,58vh)}
    body.solo-orb #scena{flex:1 1 auto}
    #discorso{padding:16px 28px 12px 8px}
    #scrivi{padding:10px 28px 16px 8px}
    #abbina{padding:0 36px 2vh 8px;justify-content:center}
    #invito{min-height:80px}
  }
</style>
<body class="da-abbinare">
<div id="scena">
  <canvas id="orb"></canvas>
  <div id="detto"></div>
  <div id="linea"></div>
</div>

<div id="lato">
<section id="abbina">
  <h2>Abbina questo dispositivo</h2>
  <p>Sul PC apri le impostazioni di NOVA, alla voce Portale, accendilo e premi «Mostra il codice». Poi apri l'invito su questo dispositivo, oppure incollalo qui sotto.</p>
  <textarea id="invito" placeholder="nova://abbina?…" spellcheck="false" autocapitalize="off" aria-label="L'invito"></textarea>
  <p id="doveInvito"></p>
  <button class="bottone primo" id="btnAbbina" disabled>Abbina</button>
  <p id="erroreAbbina"></p>
</section>

<div id="discorso"></div>
<form id="scrivi">
  <input type="text" id="campo" placeholder="Scrivi a NOVA" autocomplete="off" enterkeyhint="send" aria-label="Scrivi a NOVA">
  <button class="bottone primo" id="btnInvia" type="submit">Invia</button>
</form>
</div>

<script type="module">
import { creaOrb } from './orb.js';
import { rendi, pulisci } from './markdown.js';
import { T, impostaLingua, traduciDocumento } from './lingue.js';

const $ = id => document.getElementById(id);
const tauri = window.__TAURI__;
const invoke = tauri?.core?.invoke;
const ascolta = tauri?.event?.listen;

// Il dispositivo non ha il pannello di NOVA: la lingua e' la sua.
impostaLingua((navigator.language || 'it').slice(0, 2).toLowerCase());
traduciDocumento();

// Grande com'e' qui, su un tablet l'orb non ci sta nei suoi fotogrammi: si
// regola da solo su quanti pixel disegnare (D451). E lo disegna alleggerito
// (D453): meno passi nella nuvola e meno strati di rumore, cosi' nello stesso
// tempo ci stanno piu' del doppio dei pixel per lato. Sul Tab A8, il 28
// novembre, con l'orb largo 720 punti (1080 pixel): col disegno pieno 216
// pixel di lato a 26 al secondo, con 16 passi e 3 strati 429 a 31, con 14 e
// 2 479 a 38.
const PASSI_SUL_TABLET = 14, STRATI_SUL_TABLET = 2;
const orb = creaOrb($('orb'), { fluido: true, passi: PASSI_SUL_TABLET, strati: STRATI_SUL_TABLET });
window.orb = orb;
const DETTO = { quiete: 'a riposo', ascolto: 'ti ascolto', penso: 'ci penso',
  agisco: 'sto facendo', parlo: 'sto parlando', chiedo: 'aspetto un tuo ok sul PC',
  allarme: 'qualcosa non va', spento: 'a riposo' };
/* A riposo l'orb dice tutto da solo, e sotto non si scrive niente: e' una
   cosa a cui si parla. Le parole compaiono quando c'e' qualcosa da dire:
   che sta facendo, che aspetta un ok, che non trova il PC. */
const SENZA_PAROLE = new Set(['spento', 'quiete']);
let stato = 'spento', passo = '', abbinato = false, collegato = false;
function spiega(){
  $('detto').textContent = !abbinato ? T('da abbinare al PC')
    : !collegato ? T('cerco il PC…')
    : passo || (SENZA_PAROLE.has(stato) ? '' : T(DETTO[stato] || stato));
}
function metti(nuovo){ stato = DETTO[nuovo] ? nuovo : 'quiete'; orb.stato(stato); spiega(); }
metti('spento');

/* Il discorso. Quello che dice NOVA passa dal suo markdown; quello che
   scrive chi ha il dispositivo in mano entra come testo. */
function battuta(da, testo){
  const riga = document.createElement('div');
  riga.className = 'battuta ' + (da === 'utente' ? 'tua' : da === 'guaio' ? 'guaio' : 'sua');
  const bolla = document.createElement('div'); bolla.className = 'bolla';
  if(da === 'nova') bolla.innerHTML = rendi(pulisci(testo));
  else bolla.textContent = testo;
  riga.append(bolla);
  $('discorso').append(riga);
  $('discorso').scrollTop = $('discorso').scrollHeight;
}

/* Solo l'orb (D452). Il tablet si usa a voce: finche' nessuno tocca lo
   schermo c'e' l'orb al centro e basta. Un tocco fa comparire il discorso e
   il campo per scrivere; dopo mezzo minuto senza toccare, se non si sta
   scrivendo, tornano via. Da abbinare, l'invito si vede sempre. */
const TORNA_SOLO_DOPO_MS = 30000;
let tornaSolo = null;
function soloOrb(si){
  clearTimeout(tornaSolo);
  document.body.classList.toggle('solo-orb', si && abbinato);
  if(!abbinato) return;
  if(si) document.activeElement?.blur?.();
  else tornaSolo = setTimeout(seFermoTornaSolo, TORNA_SOLO_DOPO_MS);
}
function seFermoTornaSolo(){
  const scrive = document.activeElement === $('campo') || $('campo').value.trim();
  if(scrive) tornaSolo = setTimeout(seFermoTornaSolo, TORNA_SOLO_DOPO_MS);
  else soloOrb(true);
}
$('scena').addEventListener('click', () => soloOrb(!document.body.classList.contains('solo-orb')));
$('lato').addEventListener('pointerdown', () => {
  if(!document.body.classList.contains('solo-orb')) soloOrb(false);
});

/* Il microfono (D455). Il tablet si usa a voce: se il microfono non si apre
   (di solito manca il permesso) NOVA non sente, e chi parla deve saperlo
   senza andarlo a cercare. Sta scritto sotto l'orb finche' non si apre. */
function mostraMicrofono(m){
  const sordo = abbinato && collegato && !m?.aperto && !!m?.errore;
  const el = $('linea');
  el.classList.toggle('guaio', (abbinato && !collegato) || sordo);
  el.textContent = sordo ? T('il microfono non si apre: non ti sento') : '';
}

/* Il filo col PC: abbinato o no, collegato o no. */
function mostraLinea(l){
  collegato = !!l?.collegato;
  // Appena abbinato, il campo dell'invito sparisce e il sistema passerebbe
  // il fuoco al campo per scrivere, aprendo la tastiera senza che nessuno
  // l'abbia chiesta.
  const appenaAbbinato = !abbinato && !!l?.abbinato;
  if(appenaAbbinato) document.activeElement?.blur?.();
  abbinato = !!l?.abbinato;
  if(appenaAbbinato || !abbinato) soloOrb(abbinato);
  document.body.classList.toggle('da-abbinare', !l?.abbinato);
  mostraMicrofono(l?.microfono);
  if(!l?.abbinato) $('erroreAbbina').textContent = l?.errore ? T(l.errore) : $('erroreAbbina').textContent;
  $('btnInvia').disabled = !collegato;
  // Lo stato dell'orb arriva con gli eventi, e una pagina che si apre a
  // filo gia' teso non ha sentito gli ultimi: col filo arriva anche l'ultimo
  // stato che il programma ha visto. Senza PC l'orb e' spento.
  metti(collegato ? (l?.orb || 'spento') : 'spento');
}

/* L'invito: incollato o aperto da fuori, non abbina da solo. Prima si
   legge dove porta, poi si preme. */
async function guardaInvito(){
  const testo = $('invito').value.trim();
  $('erroreAbbina').textContent = '';
  $('doveInvito').textContent = '';
  $('btnAbbina').disabled = true;
  if(!testo) return;
  try {
    const dove = await invoke('leggi_invito', { invito: testo });
    $('doveInvito').textContent = T('Porta al PC che risponde a: ') + dove.indirizzi.join(', ');
    $('btnAbbina').disabled = false;
  } catch(e){ $('erroreAbbina').textContent = String(e); }
}
function arrivaInvito(testo){
  if(!testo || !document.body.classList.contains('da-abbinare')) return;
  $('invito').value = testo;
  guardaInvito();
}
$('invito').addEventListener('input', guardaInvito);
$('btnAbbina').onclick = async () => {
  $('btnAbbina').disabled = true;
  $('erroreAbbina').textContent = '';
  // Il nome con cui il PC mostra questo dispositivo: il modello, se si legge.
  const modello = (navigator.userAgent.match(/;\s*([^;)]+?)\s+Build\//) || [])[1] || 'Tablet';
  try {
    await invoke('abbina', { invito: $('invito').value.trim(), nome: modello });
    $('invito').value = ''; $('doveInvito').textContent = '';
  } catch(e){ $('erroreAbbina').textContent = String(e); $('btnAbbina').disabled = false; }
};

/* Scrivere a NOVA. */
$('scrivi').addEventListener('submit', async ev => {
  ev.preventDefault();
  const testo = $('campo').value.trim();
  if(!testo || !collegato) return;
  $('campo').value = '';
  battuta('utente', testo);
  try {
    const risposta = await invoke('parla', { testo });
    if(risposta.trim()) battuta('nova', risposta);
  } catch(e){ battuta('guaio', String(e)); }
});

ascolta?.('nova://linea', ev => mostraLinea(ev.payload));
ascolta?.('nova://invito', ev => arrivaInvito(String(ev.payload || '')));
ascolta?.('nova://microfono', ev => mostraMicrofono(ev.payload));
ascolta?.('nova://stato', ev => { if(collegato) metti(String(ev.payload?.stato || 'quiete')); });
ascolta?.('nova://passo', ev => { passo = String(ev.payload?.testo || ''); spiega(); });
ascolta?.('nova://voce', ev => {
  const testo = String(ev.payload?.testo || '');
  if(testo.trim()) battuta(ev.payload?.da === 'utente' ? 'utente' : 'nova', testo);
});

/* Il documento non deve scorrere mai: se il sistema lo sposta per la
   tastiera, lo si rimette a posto. */
const fermo = () => { if(window.scrollX || window.scrollY) window.scrollTo(0, 0); };
window.addEventListener('scroll', fermo);
window.visualViewport?.addEventListener('resize', fermo);

if(invoke){
  invoke('linea').then(mostraLinea).catch(() => {});
  invoke('invito_in_arrivo').then(arrivaInvito).catch(() => {});
}
</script>
</body>
</html>
