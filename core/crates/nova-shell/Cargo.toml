[package]
name = "nova-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Il guscio di NOVA: l'orb che galleggia, la chat, le impostazioni. Rust sotto, WebView del sistema sopra."

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Per portare l'editor dell'harness: scaricarlo, controllarne l'impronta,
# aprirlo. Vedi `build.rs` (D336).
ureq = "2"
flate2 = "1"
sha2 = "0.10"
base64 = "0.22"

[dependencies]
nova-proto = { path = "../nova-proto" }
nova-configurazione = { path = "../nova-configurazione" }
# Cercare i GGUF e dire se un cervello e' pronto sono cose gia' portate:
# il guscio le chiede, non le rifa'.
nova-modelli = { path = "../nova-modelli" }
nova-cervelli = { path = "../nova-cervelli" }
# Le parole con cui si racconta un guasto, e cosa si mostra di cio'
# che una CLI ha scritto: stanno li', gia' provate.
nova-guasti = { path = "../nova-guasti" }
nova-platform = { path = "../nova-platform" }
# Quali cartelle un progetto non mostra, e come si parla a NOVA di cio' che
# e' aperto: l'harness del guscio usa le stesse regole di quello di NOVA.
nova-harness = { path = "../nova-harness" }
# Il Word nell'harness: letto nel suo ordine, riscritto solo dove cambia.
nova-docx = { path = "../nova-docx" }
# *Cerca* dentro i PDF: il testo delle pagine (D343).
nova-documenti = { path = "../nova-documenti" }
# *Cerca*: la parola intera e le espressioni regolari (D343).
regex = "1"
tauri = { version = "2", features = ["tray-icon"] }
# La guardia di istanza singola: due doppi clic non devono dare due orb.
# Vedi `finestre::richiama` per cosa fa il secondo.
tauri-plugin-single-instance = "2"
# «Apri cartella» nell'harness: la finestra di scelta del sistema.
tauri-plugin-dialog = "2"
# Il terminale dell'harness: una console vera (ConPTY su Windows), non un
# processo con i tubi — i programmi che chiedono qualcosa, i colori, le
# frecce funzionano solo se credono di parlare a un terminale.
portable-pty = "0.9"
# Quel che il terminale scrive viaggia verso la pagina come testo: byte
# qualunque, anche meta' di una lettera accentata, dentro una stringa.
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
