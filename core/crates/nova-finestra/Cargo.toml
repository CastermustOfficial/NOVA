[package]
name = "nova-finestra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Quanto della conversazione ci sta nella memoria del modello."

[dependencies]
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }

[features]
banco = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "banco-finestra"
path = "src/banco.rs"
required-features = ["banco"]
