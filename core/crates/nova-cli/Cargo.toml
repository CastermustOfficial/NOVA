[package]
name = "nova-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client da riga di comando per nova-core."

[[bin]]
name = "nova"
path = "src/main.rs"

[dependencies]
nova-proto = { path = "../nova-proto" }
# I comandi che non passano dal demone (D350): configurazione e modelli, per
# l'installatore, che senza questi voleva Python.
nova-configurazione = { path = "../nova-configurazione" }
nova-modelli = { path = "../nova-modelli" }
nova-cervelli = { path = "../nova-cervelli" }
# `nova componenti` (D351): il catalogo e le regole stanno li', la rete e gli
# zip qui.
nova-componenti = { path = "../nova-componenti" }
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
