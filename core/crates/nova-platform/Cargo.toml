[package]
name = "nova-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Accesso al sistema operativo dietro un'astrazione: albero di accessibilita', un backend per OS."

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Variant",
    # CreatePropertyCondition prende una VARIANT, che vive qui: senza questa
    # feature il filtro per ruolo non si puo' costruire e la ricerca dovrebbe
    # leggere il nome di ogni nodo.
    "Win32_System_Ole",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # GetDriveTypeW: distinguere un disco fisso da una chiavetta o da
    # una unita' di rete. Una riga sola, ma senza di lei la ricerca
    # «ovunque» dei modelli si impianta sul primo disco di rete montato.
    "Win32_Storage_FileSystem",
    # DXGI: quanta memoria video c'e' e quanta ne resta, per qualunque
    # scheda - non solo per quelle NVIDIA, che e' quanto sapeva dire
    # nvidia-smi.
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # LoadLibrary/GetProcAddress: NVML si carica a mano, se c'e'. Non e' una
    # dipendenza dal driver NVIDIA - e' una dipendenza *facoltativa*, che su
    # una Radeon semplicemente non si trova e non cambia niente.
    "Win32_System_LibraryLoader",
    # Gli appunti chiamati direttamente, senza PowerShell in mezzo: Windows
    # si appoggia a NOVA, non il contrario (D130). `DataExchange` e' dove
    # vivono Open/Get/SetClipboardData; la memoria degli appunti si alloca
    # con GlobalAlloc, che sta in `Memory`.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # Core Audio: chi il volume lo tiene davvero. Dall'altra parte il volume
    # e' cinquanta pressioni simulate del tasto «volume giu'» e poi N di
    # «volume su», e nessuno che lo rilegga. Vedi D130.
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    # `IMMDevice::Activate` e' generico e prende una PROPVARIANT: senza
    # questa feature il metodo non esiste affatto, e l'errore dice solo
    # «no method named Activate».
    "Win32_System_Com_StructuredStorage",
    # L'area di notifica: `Shell_NotifyIconW` e la NOTIFYICONDATAW che le si
    # passa. Dall'altra parte la notifica e' un processo PowerShell che resta
    # in piedi nove secondi, e a farlo e' NOVA (D134).
    "Win32_UI_Shell",
    # I processi: la fotografia di chi c'e' (ToolHelp), quanta memoria usa
    # (ProcessStatus) e il permesso di fermarne uno (Threading).
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    # SendInput: premere i tasti senza passare da SendKeys, che e' un piccolo
    # linguaggio con dentro caratteri da proteggere a mano.
    "Win32_UI_Input_KeyboardAndMouse",
    # Com'e' fatto il PC, chiesto al sistema invece che a una query WMI dentro
    # una stringa: memoria, processori, tempo acceso (SystemInformation), la
    # batteria (Power) e il nome commerciale del sistema e della CPU, che
    # vivono nel registro e non hanno un'altra casa.
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_Registry",
]

# Una risposta sola alla domanda «quanta memoria video c'e'»: la usano
# l'installatore, il demone e il Python, che finora se la rispondevano da soli
# chiamando ognuno `nvidia-smi`.
[[bin]]
name = "nova-schede"
path = "src/bin/nova-schede.rs"

[[bin]]
name = "nova-appunti"
path = "src/bin/nova-appunti.rs"

[[bin]]
name = "nova-volume"
path = "src/bin/nova-volume.rs"

[[bin]]
name = "nova-notifica"
path = "src/bin/nova-notifica.rs"

[[bin]]
name = "nova-sistema"
path = "src/bin/nova-sistema.rs"

[[bin]]
name = "nova-app"
path = "src/bin/nova-app.rs"

[[bin]]
name = "nova-finestre"
path = "src/bin/nova-finestre.rs"

[[bin]]
name = "nova-processi"
path = "src/bin/nova-processi.rs"

[[bin]]
name = "nova-tastiera"
path = "src/bin/nova-tastiera.rs"
