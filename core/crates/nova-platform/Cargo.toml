[package]
name = "nova-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Accesso al sistema operativo dietro un'astrazione: albero di accessibilita', un backend per OS."

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Variant",
    # CreatePropertyCondition prende una VARIANT, che vive qui: senza questa
    # feature il filtro per ruolo non si puo' costruire e la ricerca dovrebbe
    # leggere il nome di ogni nodo.
    "Win32_System_Ole",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
]
