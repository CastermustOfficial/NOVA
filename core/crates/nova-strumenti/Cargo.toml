[package]
name = "nova-strumenti"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Le mani di NOVA sul PC: cosa sa fare, quanto costa sbagliarlo, e come si racconta a chi guarda."

[dependencies]
# I motivi dei comandi vietati sono configurabili dall'utente: sono
# espressioni regolari vere, e senza un motore vero si potrebbe solo
# riconoscerne un sottoinsieme — cioe' bloccare meno di quanto promesso.
# I modelli di ricerca dei file sono glob veri, con `**` dentro: scriverne
# uno a mano vuol dire riconoscerne un sottoinsieme, cioe' trovare meno file
# di quanti l'utente ne ha chiesti senza dirglielo.
glob = "0.3"
# L'aritmetica del calendario si fa in un posto solo: la data di un file la
# scrive lui.
nova-calendario = { path = "../nova-calendario" }
regex = "1"
# Non piu' opzionale da quando il pacchetto sa leggere le chiamate che certi
# modelli scrivono **dentro il testo** invece che nel canale dei tool: quel
# testo e' JSON, e riconoscerne un sottoinsieme scritto a mano vorrebbe dire
# eseguire cose diverse da quelle chieste.
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }

[features]
banco = ["dep:serde"]

[[bin]]
name = "banco-strumenti"
path = "src/banco.rs"
required-features = ["banco"]
