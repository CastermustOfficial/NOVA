[package]
name = "nova-pianificazione"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "«ogni lunedi' alle 9» tradotto nel prossimo istante in cui tocca."

[dependencies]
nova-calendario = { path = "../nova-calendario" }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }

[features]
banco = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "banco-pianificazione"
path = "src/banco.rs"
required-features = ["banco"]
