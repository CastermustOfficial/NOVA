[package]
name = "nova-portale"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Il portale: il canale cifrato e l'abbinamento con cui un altro dispositivo parla col NOVA del PC."

# Le due meta' dello stesso canale: quella del PC (accettare, abbinare,
# riconoscere) e quella del dispositivo (collegarsi, presentarsi). Stanno
# insieme perche' si provano l'una contro l'altra, senza demone.
[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# TLS 1.3 con rustls e `ring`, come il resto di NOVA: niente OpenSSL, niente
# store di sistema. Il certificato e' del PC, e il dispositivo lo riconosce
# dall'impronta che ha letto nel codice di abbinamento.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Il certificato del PC, fatto in casa la prima volta che il portale si accende.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
sha2 = "0.10"
base64 = "0.22"
# Il confronto dei segreti in tempo costante.
subtle = "2"
# I segreti vengono dal generatore del sistema.
getrandom = "0.3"
# Accorgersi di un capo che sparisce senza salutare (D452): le opzioni del
# socket che tokio non espone. La stessa versione che usa tokio.
socket2 = "0.6"
# Il codice di abbinamento come QR, per il pannello.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
