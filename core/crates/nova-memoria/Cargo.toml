[package]
name = "nova-memoria"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Come nova-ricette: il nucleo non ha dipendenze. serde serve solo al banco
# di confronto, che e' un binario a parte e si costruisce con `--features`.
[dependencies]
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }

[features]
banco = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "banco-memoria"
path = "src/banco.rs"
required-features = ["banco"]
