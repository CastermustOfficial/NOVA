[package]
name = "nova-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Il motore di NOVA: bus di eventi, registro di capacita', supervisione processi, server RPC locale."

[dependencies]
nova-proto = { path = "../nova-proto" }
nova-platform = { path = "../nova-platform" }
# I tratti che NOVA dichiara — «copia questo testo negli appunti» — stanno
# qui dentro. nova-core e' l'unico che conosce tutti e due i lati: chi
# chiede e chi sa fare (D130).
nova-strumenti = { path = "../nova-strumenti" }
# Le regole con cui un file salvato si applica sopra i valori di fabbrica.
# Erano scritte due volte — una in `nova/config.py` e una qui, piu' povera —
# e quella qui perdeva tutto il file per un campo storto.
nova-configurazione = { path = "../nova-configurazione" }
nova-mcp = { path = "../nova-mcp" }
# Il registro delle azioni: la forma della riga e le regole di ricerca sono
# quelle di NOVA, con il Python di fronte e un banco che li confronta.
nova-registro = { path = "../nova-registro" }
# Le procedure imparate: il giudizio sta li', qui c'e' il disco.
nova-ricette = { path = "../nova-ricette" }
# La memoria: la forma su disco e il giudizio su chi entra nel contesto.
nova-nodi = { path = "../nova-nodi" }
nova-memoria = { path = "../nova-memoria" }
nova-calendario = { path = "../nova-calendario" }
nova-potatura = { path = "../nova-potatura" }
nova-voce = { path = "../nova-voce" }
# La decisione di cosa fare quando il modello non parte sta li', confrontata
# col Python da un banco (D213). Qui c'e' solo il braccio che la esegue.
nova-modelli = { path = "../nova-modelli" }
# Le regole del turno, provate contro un mondo finto. Qui c'e' il mondo vero.
nova-ciclo = { path = "../nova-ciclo" }
# Di che specie e' un gradino: con chi si parla, e come (D219).
nova-scala = { path = "../nova-scala" }
nova-contesto = { path = "../nova-contesto" }
# Chiedere a un cervello: i tentativi, i codici, il corpo di un errore.
nova-cervelli = { path = "../nova-cervelli" }
# Come si racconta un Claude Code che si e' fermato: la quota finita, il
# tetto dei turni, l'opzione che non conosce. Gia' confrontato col Python.
nova-guasti = { path = "../nova-guasti" }
# `.strip()` di Python non e' `trim()` di Rust (D182).
nova-pitone = { path = "../nova-pitone" }
# Il cliente HTTP di casa: `nova-voce` e `nova-cervelli` parlano gia' con
# questo, e un secondo sarebbe un secondo comportamento da conoscere.
ureq = "2"
# Il web senza browser: cosa si chiede a DuckDuckGo, come si leggono i
# risultati, cosa si dice di una pagina scaricata. Confrontato col Python da
# un banco; qui c'e' solo la rete.
nova-browser = { path = "../nova-browser" }
# La connessione al browser di NOVA: schede, porta HTTP, websocket.
nova-cdp = { path = "../nova-cdp" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true

# DPAPI per l'archivio delle credenziali, e il generatore di numeri casuali
# del sistema. Solo su Windows: altrove l'archivio andra' scritto sopra il
# portachiavi locale, e per ora lo dice invece di far finta.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
]
