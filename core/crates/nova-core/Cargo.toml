[package]
name = "nova-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Il motore di NOVA: bus di eventi, registro di capacita', supervisione processi, server RPC locale."

[dependencies]
nova-proto = { path = "../nova-proto" }
nova-platform = { path = "../nova-platform" }
# I tratti che NOVA dichiara — «copia questo testo negli appunti» — stanno
# qui dentro. nova-core e' l'unico che conosce tutti e due i lati: chi
# chiede e chi sa fare (D130).
nova-strumenti = { path = "../nova-strumenti" }
nova-voce = { path = "../nova-voce" }
# La decisione di cosa fare quando il modello non parte sta li', confrontata
# col Python da un banco (D213). Qui c'e' solo il braccio che la esegue.
nova-modelli = { path = "../nova-modelli" }
# Le regole del turno, provate contro un mondo finto. Qui c'e' il mondo vero.
nova-ciclo = { path = "../nova-ciclo" }
# Chiedere a un cervello: i tentativi, i codici, il corpo di un errore.
nova-cervelli = { path = "../nova-cervelli" }
# Il cliente HTTP di casa: `nova-voce` e `nova-cervelli` parlano gia' con
# questo, e un secondo sarebbe un secondo comportamento da conoscere.
ureq = "2"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true

# DPAPI per l'archivio delle credenziali, e il generatore di numeri casuali
# del sistema. Solo su Windows: altrove l'archivio andra' scritto sopra il
# portachiavi locale, e per ora lo dice invece di far finta.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
]
