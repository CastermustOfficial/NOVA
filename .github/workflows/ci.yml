# Controlli a ogni push: se qualcosa si rompe, si sa subito e non alla release.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Formato
        working-directory: core
        run: cargo fmt --all -- --check
        continue-on-error: true
      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets
        continue-on-error: true
      - name: Test
        working-directory: core
        run: cargo test

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
        continue-on-error: true
      - name: Test
        run: python -m pytest -q
        continue-on-error: true

  # Rete di sicurezza: se un dato personale sfugge al .gitignore, meglio
  # scoprirlo qui che dopo averlo pubblicato.
  niente-dati-personali:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cerco chiavi e percorsi personali
        run: |
          set +e
          PAT='sk-ant-api|sk-proj-|ghp_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY|C:\\\\Users\\\\[a-z]'
          # riservatezza.py e i test contengono di proposito le regex e gli
          # esempi: sono il rilevatore, non il segreto.
          HIT=$(grep -rInE "$PAT" . \
                --exclude-dir=.git --exclude-dir=target --exclude-dir=.github \
                --exclude=riservatezza.py --exclude='test_*.py')
          if [ -n "$HIT" ]; then echo "$HIT"; echo "::error::possibile dato personale nel repository"; exit 1; fi
          echo "nessun dato personale"