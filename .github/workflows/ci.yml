# Controlli a ogni push: se qualcosa si rompe, si sa subito e non alla release.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Formato
        working-directory: core
        run: cargo fmt --all -- --check
        continue-on-error: true
      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets
        continue-on-error: true
      - name: Test
        working-directory: core
        shell: pwsh
        run: |
          # `cargo test` dice quali prove sono rosse **nel log**, e il log
          # richiede di essere autenticati. L'annotazione no. Le prove Python
          # lo fanno gia' da un pezzo, questo lavoro no: e' rimasto rosso due
          # volte senza che si potesse sapere cosa, se non scaricando.
          $PSNativeCommandUseErrorActionPreference = $false
          $uscita = & cargo test --no-fail-fast 2>&1 | ForEach-Object { "$_" }
          $codice = $LASTEXITCODE
          $uscita | Write-Host
          if ($codice -ne 0) {
            $rotte = $uscita | Select-String -Pattern '^test .+ \.\.\. FAILED$' |
                     ForEach-Object { ($_.ToString() -replace '^test ', '' -replace ' \.\.\. FAILED$', '') }
            if ($rotte) { Write-Host "::error::prove Rust rosse: $($rotte -join ', ')" }
            $perche = $uscita | Select-String -Pattern "panicked at|^error(\[|:)" |
                      Select-Object -First 6 | ForEach-Object { $_.ToString().Trim() }
            if ($perche) { Write-Host "::error::$($perche -join ' / ')" }
            exit 1
          }
          exit 0

  python:
    runs-on: windows-latest
    # Il README e l'installer dichiarano «Python 3.10 o superiore». Finche' la
    # CI ne provava una sola, quella riga era una promessa: quattro versioni
    # sono quattro grammatiche e quattro librerie standard, e le differenze
    # che contano non stanno nel codice che si scrive ma in quello che si
    # importa. `fail-fast: false` perche' sapere che si rompe solo su 3.10 e'
    # un'informazione diversa da «si rompe».
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Le prove di NOVA sono programmi, non casi di pytest: stampano cosa
      # controllano e finiscono con un codice di uscita. Chiamarle con pytest
      # non ne eseguiva nessuna - moriva sul primo `sys.exit` a livello di
      # modulo con «no tests ran» - e `continue-on-error` faceva risultare
      # riuscito il lavoro lo stesso. Piu' di ottocento controlli che
      # passavano sul portatile di chi scrive e non proteggevano niente qui.
      #
      # Niente schermo su un agente: le prove che aprono una finestra girano
      # in offscreen, come gia' fanno da se'.
      - name: Prove
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Uscita 2 vuol dire «non eseguibile qui»: sono le prove di
          # integrazione, che vogliono il demone acceso o un browser vero.
          # Su un agente spoglio non hanno fallito niente - non si sono
          # potute fare - e chiamarle rosse insegnerebbe a ignorare i rossi,
          # che e' esattamente come questo controllo era finito spento.
          # Le prove escono 2 di proposito quando qui non si possono fare, e
          # `pwsh` su GitHub gira con $ErrorActionPreference = 'Stop': da
          # PowerShell 7.4 un comando nativo che esce diverso da zero diventa
          # un errore terminante.
          $PSNativeCommandUseErrorActionPreference = $false
          $falliti = @()
          $saltate = @()
          Get-ChildItem test_*.py | Sort-Object Name | ForEach-Object {
            $uscita = & python $_.Name 2>&1
            $codice = $LASTEXITCODE
            $uscita | Write-Host
            if ($codice -eq 2) { $saltate += $_.Name }
            elseif ($codice -ne 0) {
              $falliti += $_.Name
              # Le ultime righe finiscono nell'annotazione: il log completo
              # richiede di essere autenticati, l'annotazione no, e sapere
              # *cosa* e' fallito senza doverlo scaricare cambia la velocita'
              # con cui lo si aggiusta.
              $coda = ($uscita | Select-Object -Last 12) -join ' / '
              Write-Host "::error::$($_.Name): $coda"
            }
          }
          $quante = (Get-ChildItem test_*.py).Count
          $verdi = $quante - $falliti.Count - $saltate.Count
          Write-Host "riepilogo: $verdi verdi, $($falliti.Count) rosse, $($saltate.Count) non provabili su $quante"
          if ($saltate) { Write-Host "::notice::saltate (serve una macchina vera): $($saltate -join ', ')" }
          if ($falliti) {
            Write-Host "::error::prove fallite: $($falliti -join ', ')"
            exit 1
          }
          # Esplicito, se no il lavoro eredita il codice di uscita dell'ultima
          # prova - e l'ultima in ordine alfabetico esce 2 perche' qui non si
          # puo' fare. Rosso senza una riga che dica quale prova: e' successo,
          # ed e' costato un giro intero a capire che non era una prova rotta.
          exit 0
        shell: pwsh

  # Rete di sicurezza: se un dato personale sfugge al .gitignore, meglio
  # scoprirlo qui che dopo averlo pubblicato.
  #
  # La regola non e' piu' scritta qui dentro. Era un grep con due esenzioni:
  # non si poteva lanciare prima di spingere, e le esenzioni conoscevano i
  # nomi dei file di un linguaggio solo - il rilevatore intanto era nato
  # anche in Rust, con le sue prove dentro `src/*.rs`, e la rete era tesa
  # dove i pesci non passavano piu'. Adesso e' una prova del progetto:
  # `test_niente_dati_personali.py`, che chiunque puo' leggere e lanciare.
  # Gira anche fra le prove Python su Windows; qui resta un lavoro a parte
  # perche' dura sei secondi e dice subito se si sta per pubblicare qualcosa
  # che non si puo' piu' ritirare.
  niente-dati-personali:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cerco chiavi e percorsi personali
        run: python test_niente_dati_personali.py
  # La luce prima delle mani (D209). Mac e Linux non si possono provare dalla
  # macchina di chi scrive, e finche' nessuna macchina diversa guarda, il
  # codice che sta dietro a #[cfg(windows)] non e' verde: e' non guardato.
  #
  # Misurato su Linux il 16 settembre, prima di scrivere questo lavoro: tutto
  # lo spazio di lavoro si compila, 505 prove verdi e zero rosse - dopo aver
  # sistemato le prove di `nova-cartelle`, che erano scritte solo con i
  # backslash e la' dentro non separano niente. Due cose sole servono da fuori:
  #
  # - `libasound2-dev`: cpal parla ad ALSA, e senza l'intestazione non si
  #   compila nemmeno `nova-voce`. Su macOS non serve, Core Audio c'e' gia';
  # - `nova-shell` resta fuori: e' l'involucro Tauri e vuole gtk e webkit
  #   installati. Non e' un difetto da scoprire, e' il pezzo che CANT-9 dovra'
  #   portare davvero. Tenerlo fuori rende il lavoro onesto - dice cosa vale
  #   gia' ovunque, senza far finta sul resto.
  #
  # macOS invece non l'ha ancora guardato nessuno: se il primo giro e' rosso
  # li', e' esattamente il motivo per cui questo lavoro esiste.
  altrove:
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Quel che serve da fuori
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Dipendenze
        # Le stesse del lavoro su Windows: una prova che gira con meno
        # librerie non e' la stessa prova, e le differenze si scoprirebbero
        # come differenze di sistema invece che di ambiente. Il primo giro
        # senza queste e' finito rosso proprio cosi': `nova/agent.py` non si
        # importava, e sembrava un difetto di Linux.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prove
        working-directory: core
        shell: bash
        run: |
          # Come per gli altri lavori: il log completo lo legge chi e'
          # autenticato, l'annotazione la legge chiunque.
          set +e
          cargo test --workspace --exclude nova-shell --no-fail-fast 2>&1 | tee /tmp/prove.log
          esito=${PIPESTATUS[0]}
          if [ "$esito" -ne 0 ]; then
            rotte=$(grep -E '^test .+ \.\.\. FAILED$' /tmp/prove.log | sed 's/^test //; s/ \.\.\. FAILED$//' | tr '\n' ' ')
            if [ -n "$rotte" ]; then echo "::error::prove Rust rosse su ${{ matrix.sistema }}: $rotte"; fi
            perche=$(grep "panicked at" /tmp/prove.log | head -5 | tr '\n' '|')
            if [ -n "$perche" ]; then echo "::error::$perche"; fi
            exit 1
          fi

      # Le prove Python **anche qui**, ed e' il punto di tutto CANT-9.
      #
      # Prima questo lavoro faceva solo `cargo test`, quindi di NOVA in Python
      # su Linux e macOS non guardava niente nessuno. Il giorno in cui le si e'
      # fatte girare davvero ne sono uscite tre rosse, e nessuna delle tre era
      # una prova scritta male: `ruota_se_serve` **spostava una cartella**
      # (su Windows una cartella misura zero byte e usciva da sola; altrove ne
      # misura 4096), i percorsi protetti erano i quattro di Windows che
      # cominciano per `C:\` — cioe' fuori da Windows NOVA non proteggeva
      # niente — e due prove ponevano in windowsese domande che altrove non
      # volevano dire niente.
      #
      # Tre difetti veri, invisibili per mesi perche' nessuna macchina diversa
      # li guardava mai. Da qui in poi li guarda questa.
      - name: Prove Python
        shell: bash
        # Niente schermo su un agente: le prove che aprono una finestra
        # girano in offscreen, come gia' fa il lavoro su Windows.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          falliti=()
          saltate=()
          for f in test_*.py; do
            uscita=$(python "$f" 2>&1)
            codice=$?
            echo "$uscita"
            if [ "$codice" -eq 2 ]; then
              saltate+=("$f")
            elif [ "$codice" -ne 0 ]; then
              falliti+=("$f")
              # La coda nell'annotazione: il log completo lo legge chi e'
              # autenticato, l'annotazione la legge chiunque.
              coda=$(echo "$uscita" | tail -12 | tr '\n' '/')
              echo "::error::$f su ${{ matrix.sistema }}: $coda"
            fi
          done
          quante=$(ls test_*.py | wc -l)
          echo "riepilogo: $((quante - ${#falliti[@]} - ${#saltate[@]})) verdi, ${#falliti[@]} rosse, ${#saltate[@]} non provabili su $quante"
          if [ ${#saltate[@]} -gt 0 ]; then
            echo "::notice::saltate su ${{ matrix.sistema }} (serve una macchina vera o un banco costruito): ${saltate[*]}"
          fi
          if [ ${#falliti[@]} -gt 0 ]; then
            echo "::error::prove Python rosse su ${{ matrix.sistema }}: ${falliti[*]}"
            exit 1
          fi
          # Esplicito: se no il lavoro eredita il codice dell'ultima prova, e
          # l'ultima in ordine alfabetico esce 2 perche' qui non si puo' fare.
          exit 0
          verdi=$(grep -E '^test result: ok\.' /tmp/prove.log | sed -E 's/^test result: ok\. ([0-9]+) passed.*/\1/' | awk '{s+=$1} END {print s+0}')
          echo "riepilogo: $verdi prove verdi su ${{ matrix.sistema }}"
  # I gemelli, che fino a oggi su questa CI non hanno mai girato.
  #
  # Ventuno prove `test_*_rust.py` mettono la meta' Python e la meta' Rust una
  # di fronte all'altra. Escono 2 — «non provabile qui» — quando il banco non
  # e' costruito, e nessun lavoro lo costruiva: quindi su ogni push quelle
  # ventuno dicevano «saltata» e nessuno le eseguiva mai, tranne chi le
  # lanciava a mano sulla propria macchina. Un metodo intero che riposava su
  # una persona che si ricorda.
  #
  # Questo lavoro le costruisce e le esegue. E il primo giro ha gia' detto
  # qualcosa: il proiettore multimodale si cercava con `glob`, che su Windows
  # non distingue le maiuscole e su Linux si' — quindi un `MMPROJ-F16.GGUF`
  # non si trovava, e NOVA restava cieca senza dirlo (D279).
  gemelli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Costruisco i banchi
        working-directory: core
        shell: bash
        # I banchi si costruiscono in `release` perche' e' li' che le prove
        # Python li cercano - e perche' uno di loro macina centomila casi.
        run: |
          pacchetti=$(grep -l 'name = "banco-' crates/*/Cargo.toml \
                      | sed 's|crates/|-p |; s|/Cargo.toml||' | tr '\n' ' ')
          echo "banchi: $pacchetti"
          cargo build --release --features banco $pacchetti
          ls target/release/banco-* | grep -v '\.d$' | wc -l
      - name: I gemelli
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          falliti=()
          saltate=()
          for f in test_*_rust.py; do
            uscita=$(python "$f" 2>&1)
            codice=$?
            echo "$uscita"
            if [ "$codice" -eq 2 ]; then
              saltate+=("$f")
            elif [ "$codice" -ne 0 ]; then
              falliti+=("$f")
              coda=$(echo "$uscita" | tail -12 | tr '\n' '/')
              echo "::error::$f: $coda"
            fi
          done
          quante=$(ls test_*_rust.py | wc -l)
          echo "riepilogo: $((quante - ${#falliti[@]} - ${#saltate[@]})) gemelli verdi, ${#falliti[@]} rossi, ${#saltate[@]} non provabili su $quante"
          # Qui «saltata» vuol dire che il banco serve una macchina vera - un
          # Chrome acceso, un server MCP - non che non e' stato costruito.
          if [ ${#saltate[@]} -gt 0 ]; then
            echo "::notice::gemelli saltati (serve una macchina vera): ${saltate[*]}"
          fi
          if [ ${#falliti[@]} -gt 0 ]; then
            echo "::error::gemelli rossi: ${falliti[*]}"
            exit 1
          fi
          exit 0
